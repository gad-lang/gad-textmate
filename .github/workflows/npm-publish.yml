# Publish the package to npm on a version tag (a new release).
#
# Trigger: push a tag `vX.Y.Z` whose number matches package.json's "version"
# (a mismatch fails fast, so a stray tag never publishes the wrong version), or
# run manually via workflow_dispatch. Requires an `NPM_TOKEN` repo secret (an npm
# automation token with publish rights to the @gad-lang scope).
#
# This package ships static files (grammars, language config, schemas) — there is
# no build step, so it publishes as-is.
name: npm-publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag v$tag != package.json version $pkg" >&2
            exit 1
          fi
      # A pre-release version (one with a `-rc`/`-beta` suffix) publishes under the
      # `next` dist-tag so it never moves `latest`.
      - name: Publish to npm
        run: |
          ver="$(node -p "require('./package.json').version")"
          tag=latest
          case "$ver" in *-*) tag=next ;; esac
          echo "publishing $ver under dist-tag $tag"
          npm publish --access public --provenance --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
